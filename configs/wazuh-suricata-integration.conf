<!--
  Wazuh Manager / Agent Configuration File Extension
  Path: /var/ossec/etc/ossec.conf
  
  Description: 
  This configuration block enables the Wazuh Logcollector engine to continuously 
  monitor and ingest the JSON alerts generated by the Suricata IDS engine.
-->

```bash
<ossec_config>
  <localfile>
    <!-- Path to Suricata's comprehensive JSON output file -->
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
  </localfile>
</ossec_config>
```
